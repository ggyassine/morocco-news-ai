name: Reprocess Existing News

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reprocess existing news
        run: python reprocess_news.py

      - name: Export updated news
        run: python export_news.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/news.db docs/news.json
          git diff --cached --quiet || git commit -m "Reprocess existing news"
          git push
