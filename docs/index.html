<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Morocco News AI - منصة ذكية للأخبار المغربية">
  <title>Morocco News AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080a0f;
      --surface: #11141b;
      --surface-2: #181c25;
      --border: #252a35;
      --text: #f5f7fa;
      --muted: #8f96a3;
      --accent: #e9b949;
      --accent-2: #f2cf78;
      --green: #3ddc97;
      --red: #ff5c5c;
      --blue: #5da9ff;
    }

    body {
      font-family: Arial, "Noto Sans Arabic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    /* Header */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 10, 15, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(145deg, #f0c65a, #9b6c12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #080a0f;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 5px 20px rgba(233, 185, 73, 0.15);
    }

    .brand h1 {
      font-size: 18px;
      letter-spacing: -0.4px;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .refresh {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      font-size: 19px;
      cursor: pointer;
    }

    .refresh:active {
      transform: scale(0.94);
    }

    /* Hero */

    .hero {
      padding: 30px 18px 20px;
    }

    .hero-box {
      background:
        radial-gradient(circle at top right, rgba(233,185,73,0.13), transparent 35%),
        linear-gradient(145deg, #141821, #0e1117);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 25px;
      overflow: hidden;
      position: relative;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--accent-2);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .pulse {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(61,220,151,0.08);
    }

    .hero h2 {
      font-size: clamp(26px, 5vw, 42px);
      line-height: 1.25;
      max-width: 700px;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .hero p {
      color: var(--muted);
      max-width: 650px;
      line-height: 1.8;
      font-size: 14px;
    }

    /* Search */

    .search-wrap {
      padding: 0 18px 18px;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      height: 50px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--text);
      padding: 0 48px 0 16px;
      outline: none;
      font-size: 14px;
    }

    .search input:focus {
      border-color: #4b515e;
    }

    .search-icon {
      position: absolute;
      right: 17px;
      top: 14px;
      color: var(--muted);
      font-size: 19px;
    }

    /* Categories */

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 0 18px 22px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .category.active {
      background: var(--accent);
      color: #101010;
      border-color: var(--accent);
      font-weight: bold;
    }

    /* Section */

    .section-head {
      padding: 5px 18px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-head h2 {
      font-size: 20px;
    }

    .section-head span {
      color: var(--muted);
      font-size: 11px;
    }

    /* News */

    .news-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 18px;
    }

    .news-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      transition: 0.2s ease;
    }

    .news-card:hover {
      border-color: #3b414d;
      transform: translateY(-2px);
    }

    .news-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .tag {
      font-size: 10px;
      border-radius: 7px;
      padding: 5px 8px;
      background: rgba(233,185,73,0.12);
      color: var(--accent-2);
      white-space: nowrap;
    }

    .time {
      color: var(--muted);
      font-size: 10px;
    }

    .news-card h3 {
      font-size: 17px;
      line-height: 1.65;
      margin-bottom: 9px;
    }

    .news-card p {
      color: #a9afba;
      font-size: 13px;
      line-height: 1.8;
      margin-bottom: 16px;
    }

    .news-bottom {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .source {
      color: var(--muted);
      font-size: 10px;
    }

    .status {
      font-size: 10px;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(61,220,151,0.09);
      color: var(--green);
    }

    .status.warning {
      background: rgba(233,185,73,0.09);
      color: var(--accent-2);
    }

    .status.danger {
      background: rgba(255,92,92,0.09);
      color: var(--red);
    }

    /* Empty */

    .empty {
      margin: 0 18px;
      padding: 50px 20px;
      border: 1px dashed var(--border);
      border-radius: 18px;
      text-align: center;
      color: var(--muted);
      display: none;
    }

    .empty-icon {
      font-size: 35px;
      margin-bottom: 12px;
    }

    /* Bottom navigation */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 67px;
      background: rgba(12,14,20,0.96);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
    }

    .nav-inner {
      width: 100%;
      max-width: 550px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      min-width: 70px;
    }

    .nav-item .icon {
      font-size: 20px;
    }

    .nav-item.active {
      color: var(--accent);
    }

    /* Loading */

    .loading {
      padding: 30px 18px;
      display: none;
    }

    .loader {
      height: 90px;
      background: linear-gradient(
        90deg,
        var(--surface),
        var(--surface-2),
        var(--surface)
      );
      background-size: 200% 100%;
      animation: loading 1.2s infinite;
      border-radius: 18px;
      margin-bottom: 12px;
    }

    @keyframes loading {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* Desktop */

    @media (max-width: 700px) {
      .news-list {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 20px;
      }

      .hero-box {
        padding: 21px;
      }

      .hero h2 {
        font-size: 26px;
      }
    }

    @media (min-width: 1000px) {
      .news-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="header-inner">

        <div class="brand">
          <div class="logo">M</div>

          <div>
            <h1>Morocco News AI</h1>
            <span>الذكاء الاصطناعي للأخبار المغربية</span>
          </div>
        </div>

        <button class="refresh" onclick="loadNews()" aria-label="تحديث">
          ↻
        </button>

      </div>
    </header>


    <main>

      <section class="hero">

        <div class="hero-box">

          <div class="hero-label">
            <span class="pulse"></span>
            مباشر
          </div>

          <h2>
            آخر الأخبار المغربية
            <br>
            في مكان واحد
          </h2>

          <p>
            نظام ذكي يجمع الأخبار من مصادر متعددة، يتحقق من المعلومات،
            يصنفها ويقدمها لك بشكل مختصر وواضح.
          </p>

        </div>

      </section>


      <section class="search-wrap">

        <div class="search">

          <span class="search-icon">⌕</span>

          <input
            id="search"
            type="search"
            placeholder="ابحث في الأخبار..."
            oninput="renderNews()"
          >

        </div>

      </section>


      <div class="categories">

        <button class="category active" onclick="setCategory('الكل', this)">
          الكل
        </button>

        <button class="category" onclick="setCategory('أخبار المغرب', this)">
          المغرب
        </button>

        <button class="category" onclick="setCategory('رياضة', this)">
          الرياضة
        </button>

        <button class="category" onclick="setCategory('انتقالات اللاعبين', this)">
          انتقالات اللاعبين
        </button>

        <button class="category" onclick="setCategory('اقتصاد', this)">
          اقتصاد
        </button>

        <button class="category" onclick="setCategory('مجتمع', this)">
          مجتمع
        </button>

        <button class="category" onclick="setCategory('سياسة', this)">
          سياسة
        </button>

      </div>


      <div class="section-head">

        <h2>آخر الأخبار</h2>

        <span id="count">0 خبر</span>

      </div>


      <div class="loading" id="loading">

        <div class="loader"></div>
        <div class="loader"></div>
        <div class="loader"></div>

      </div>


      <section class="news-list" id="newsList"></section>


      <div class="empty" id="empty">

        <div class="empty-icon">⌕</div>

        <div>
          لا توجد أخبار مطابقة للبحث
        </div>

      </div>

    </main>

  </div>


  <nav class="bottom-nav">

    <div class="nav-inner">

      <button class="nav-item active" onclick="goTop()">
        <span class="icon">⌂</span>
        الرئيسية
      </button>

      <button class="nav-item" onclick="setCategory('انتقالات اللاعبين', null)">
        <span class="icon">⚽</span>
        الانتقالات
      </button>

      <button class="nav-item" onclick="focusSearch()">
        <span class="icon">⌕</span>
        البحث
      </button>

      <button class="nav-item" onclick="loadNews()">
        <span class="icon">↻</span>
        تحديث
      </button>

    </div>

  </nav>


  <script>

    let allNews = []

    let currentCategory = "الكل"


    /*
      أخبار تجريبية مؤقتة.
      بعد ربط النظام بقاعدة الأخبار سيتم استبدالها
      تلقائيا ببيانات news.json.
    */

    const demoNews = [

      {
        title: "النظام جاهز لاستقبال آخر الأخبار المغربية",
        summary: "هذه نسخة تجريبية من واجهة Morocco News AI. سيتم ربطها لاحقا بالأخبار التي يجمعها النظام تلقائيا.",
        source: "Morocco News AI",
        category: "أخبار المغرب",
        status: "مؤكد",
        player: "",
        url: "#",
        discovered: new Date().toISOString()
      },

      {
        title: "قسم خاص بانتقالات اللاعبين المغاربة",
        summary: "ستظهر هنا أخبار انتقالات اللاعبين المغاربة في الخارج مع تحديد طبيعة الخبر مثل رسمي أو مفاوضات أو اهتمام.",
        source: "Morocco News AI",
        category: "انتقالات اللاعبين",
        status: "مؤكد",
        player: "",
        url: "#",
        discovered: new Date().toISOString()
      },

      {
        title: "الذكاء الاصطناعي يلخص الأخبار باللغة العربية",
        summary: "يقوم النظام بتحويل الأخبار الواردة بالفرنسية أو الإنجليزية إلى ملخص عربي واضح قبل عرضها.",
        source: "Morocco News AI",
        category: "أخبار المغرب",
        status: "مؤكد",
        player: "",
        url: "#",
        discovered: new Date().toISOString()
      }

    ]


    async function loadNews() {

      document.getElementById("loading").style.display = "block"

      try {

        const response = await fetch("news.json?t=" + Date.now())

        if (!response.ok) {
          throw new Error("news.json not found")
        }

        const data = await response.json()

        if (Array.isArray(data)) {
          allNews = data
        } else if (Array.isArray(data.news)) {
          allNews = data.news
        } else {
          allNews = demoNews
        }

      } catch (error) {

        allNews = demoNews

      }

      document.getElementById("loading").style.display = "none"

      renderNews()

    }


    function renderNews() {

      const list = document.getElementById("newsList")

      const empty = document.getElementById("empty")

      const search = document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase()


      let filtered = allNews.filter(item => {

        const categoryMatch =
          currentCategory === "الكل" ||
          item.category === currentCategory

        const text =
          (
            item.title +
            " " +
            item.summary +
            " " +
            item.source +
            " " +
            item.player
          ).toLowerCase()

        const searchMatch =
          !search || text.includes(search)

        return categoryMatch && searchMatch

      })


      filtered.sort((a, b) => {

        const dateA = new Date(a.discovered || a.published || 0)

        const dateB = new Date(b.discovered || b.published || 0)

        return dateB - dateA

      })


      document.getElementById("count").textContent =
        filtered.length + " خبر"


      list.innerHTML = ""


      if (!filtered.length) {

        empty.style.display = "block"

        return

      }


      empty.style.display = "none"


      filtered.forEach(item => {

        const card = document.createElement("article")

        card.className = "news-card"


        const statusClass =
          item.status === "إشاعة"
            ? "danger"
            : item.status === "مفاوضات" ||
              item.status === "اهتمام" ||
              item.status === "غير واضح"
              ? "warning"
              : ""


        const time = formatTime(
          item.discovered || item.published
        )


        card.innerHTML = `

          <div class="news-top">

            <span class="tag">
              ${escapeHtml(item.category || "أخبار")}
            </span>

            <span class="time">
              ${time}
            </span>

          </div>


          <h3>
            ${escapeHtml(item.title || "خبر")}
          </h3>


          <p>
            ${escapeHtml(item.summary || "")}
          </p>


          <div class="news-bottom">

            <span class="source">
              ${escapeHtml(item.source || "مصدر")}
              ${item.player ? " · " + escapeHtml(item.player) : ""}
            </span>

            <span class="status ${statusClass}">
              ${escapeHtml(item.status || "غير واضح")}
            </span>

          </div>

        `


        if (item.url && item.url !== "#") {

          card.style.cursor = "pointer"

          card.onclick = () => {

            window.open(
              item.url,
              "_blank",
              "noopener,noreferrer"
            )

          }

        }


        list.appendChild(card)

      })

    }


    function setCategory(category, button) {

      currentCategory = category


      document
        .querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"))


      if (button) {

        button.classList.add("active")

      } else {

        document
          .querySelectorAll(".category")
          .forEach(btn => {

            if (btn.textContent.trim() === category) {
              btn.classList.add("active")
            }

          })

      }


      renderNews()

      goTop()

    }


    function focusSearch() {

      const input = document.getElementById("search")

      input.focus()

      window.scrollTo({
        top: 250,
        behavior: "smooth"
      })

    }


    function goTop() {

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      })

    }


    function formatTime(value) {

      if (!value) {
        return "الآن"
      }


      const date = new Date(value)

      if (isNaN(date.getTime())) {
        return "الآن"
      }


      const now = new Date()

      const diff =
        Math.floor((now - date) / 60000)


      if (diff < 1) {
        return "الآن"
      }


      if (diff < 60) {
        return "منذ " + diff + " د"
      }


      const hours = Math.floor(diff / 60)


      if (hours < 24) {
        return "منذ " + hours + " س"
      }


      return date.toLocaleDateString(
        "ar-MA",
        {
          day: "numeric",
          month: "short"
        }
      )

    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")

    }


    loadNews()

  </script>
<script src="app.js?v=20260919-2"></script>
</body>
           </html>
